<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="shortcut icon" href="sm.ico" type="image/x-icon">
<title>Nossa Listinha</title>
<style>
:root{--bg:#fdf2f4;--card:#ffffff;--ink:#2b1d22;--mut:#7a6068;--acc:#e0527a;--line:#00000018;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1418;--card:#2a1d23;--ink:#f6e9ed;--mut:#b99ba5;--acc:#ff7aa2;--line:#ffffff1f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1418;--card:#2a1d23;--ink:#f6e9ed;--mut:#b99ba5;--acc:#ff7aa2;--line:#ffffff1f;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg) center/cover fixed no-repeat;color:var(--ink);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 60px}
header{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:14px}
h1{font-size:1.7rem;margin:0;overflow-wrap:anywhere}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:0 2px 10px #0000000d}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=url],select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;margin-bottom:8px}
button{cursor:pointer;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px}
button.pri{background:var(--acc);color:#fff;border-color:transparent;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:999px;padding:6px 12px;font-size:.9rem}
.chip.on{background:var(--acc);color:#fff;border-color:transparent}
.item{display:flex;gap:12px;align-items:flex-start}
.item.done .t{text-decoration:line-through;opacity:.55}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);margin-top:2px;flex:none}
.body{flex:1;min-width:0}
.t{font-weight:600;overflow-wrap:anywhere}
.tag{font-size:.75rem;color:var(--mut)}
.note{color:var(--mut);font-size:.92rem;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-top:8px;cursor:zoom-in}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{font-size:.82rem;padding:5px 10px}
.mut{color:var(--mut);font-size:.9rem}
.empty{text-align:center;color:var(--mut);padding:30px 0}
label.f{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
input[type=color]{width:44px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none}
dialog{border:none;border-radius:16px;padding:0;width:min(940px,96vw);height:min(80vh,700px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:#000a}
.dh{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
iframe{width:100%;height:calc(100% - 58px);border:0;background:#fff}
.overflow{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Nossa Listinha ♥</h1>
    <button id="btnCfg" title="Personalizar">⚙️ Personalizar</button>
  </header>

  <div class="box" id="cfgBox" hidden>
    <strong>Personalizar o site</strong>
    <p class="mut" id="syncInfo"></p>
    <div class="row" id="codeRow" hidden style="margin-bottom:8px"><span style="flex:1 1 auto">🔑 Código secreto: <strong id="codeShow"></strong></span><button id="codeChange" style="flex:0 0 auto">Trocar código</button></div>
    <label class="f">Título <input type="text" id="cTitle" style="max-width:320px;margin:0"></label>
    <label class="f"><input type="color" id="cBg"> Cor do fundo</label>
    <label class="f"><input type="color" id="cCard"> Cor dos cartões</label>
    <label class="f"><input type="color" id="cAcc"> Cor de destaque</label>
    <div class="row" style="margin-top:6px">
      <label class="f"><span>🖼️ Imagem de fundo</span><input type="file" id="cBgImg" accept="image/*"></label>
      <button id="cBgClear" style="flex:0 0 auto">Remover imagem</button>
      <button id="cReset" style="flex:0 0 auto">Restaurar cores</button>
    </div>
  </div>

  <form class="box" id="form" onsubmit="return false">
    <input type="text" id="fText" placeholder="O que vamos fazer? (ex.: Assistir Interestelar)" maxlength="200">
    <div class="row">
      <input type="text" id="fCat" list="cats" placeholder="Categoria (Assistir, Jogar…)" maxlength="30">
      <input type="url" id="fLink" placeholder="Link (opcional)">
    </div>
    <datalist id="cats"></datalist>
    <textarea id="fNote" rows="2" placeholder="Anotações (opcional)" maxlength="1000"></textarea>
    <div class="row">
      <label class="f mut"><span>📷 Imagem</span><input type="file" id="fImg" accept="image/*"></label>
      <button class="pri" id="btnAdd" type="button" style="flex:0 0 auto">Adicionar</button>
    </div>
  </form>

  <div class="chips" id="catChips"></div>
  <div class="chips" id="stChips"></div>
  <div id="list"></div>
</div>

<dialog id="dlg">
  <div class="dh"><span class="t" id="dTitle" style="font-size:.95rem"></span>
    <span><a id="dOpen" target="_blank" rel="noopener noreferrer" style="color:var(--acc)">Abrir em nova aba ↗</a> <button id="dClose">Fechar</button></span></div>
  <iframe id="frame" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-presentation" allow="fullscreen"></iframe>
</dialog>

<dialog id="imgDlg" style="height:auto;max-height:92vh;width:min(900px,96vw);padding:8px"><img id="bigImg" style="width:100%;max-height:84vh;object-fit:contain;display:block" alt=""><button id="imgClose" style="margin-top:6px">Fechar</button></dialog>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== COLE AQUI A CONFIGURAÇÃO DO SEU FIREBASE ===== */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCe8eMSbrnAkjMx1JXx5_HLvVsgiRNf-yk",
  authDomain: "listinha-estrelinha.firebaseapp.com",
  projectId: "listinha-estrelinha",
  storageBucket: "listinha-estrelinha.firebasestorage.app",
  messagingSenderId: "862684819589",
  appId: "1:862684819589:web:38746ce3e50d6c952fb9ec"
};
/* =================================================== */
(function(){
var $=function(s){return document.querySelector(s)};
var DEF={title:"Nossa Listinha ♥",bg:"",card:"",acc:"",bgImg:""};
var items=[],cfg=Object.assign({},DEF),db=null,curCat="Todos",curSt="Todos",pendingImg="";
var LS="nossaLista.v1",BASE="";

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function safeUrl(u){try{var x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:""}catch(e){return""}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* ---------- storage ---------- */
function lsLoad(){try{var d=JSON.parse(localStorage.getItem(LS)||"{}");items=d.items||[];cfg=Object.assign({},DEF,d.cfg||{})}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({items:items,cfg:cfg}))}catch(e){}}
function saveItem(it){
  if(db){db.collection(BASE+"/items").doc(it.id).set(it).catch(function(){})}
  else{var i=items.findIndex(function(x){return x.id===it.id});if(i<0)items.push(it);else items[i]=it;lsSave();render()}
}
function delItem(id){
  if(db){db.collection(BASE+"/items").doc(id).delete().catch(function(){})}
  else{items=items.filter(function(x){return x.id!==id});lsSave();render()}
}
function saveCfg(){
  if(db){db.doc(BASE+"/cfg/theme").set(cfg).catch(function(){})}
  else lsSave();
  applyCfg();
}

/* ---------- tema ---------- */
function lum(h){var n=parseInt(h.slice(1),16);var r=n>>16,g=(n>>8)&255,b=n&255;return(0.299*r+0.587*g+0.114*b)/255}
function applyCfg(){
  var r=document.documentElement.style;
  ["--bg","--card","--acc"].forEach(function(k){});
  function set(k,v){if(v)r.setProperty(k,v);else r.removeProperty(k)}
  set("--bg",cfg.bg);set("--card",cfg.card);set("--acc",cfg.acc);
  var onBg=cfg.bg&&!cfg.bgImg;
  if(cfg.bgImg){document.body.style.backgroundImage="url('"+cfg.bgImg+"')"}else document.body.style.backgroundImage="none";
  if(cfg.card){var dark=lum(cfg.card)<0.5;set("--ink",dark?"#f6f1f3":"#2b1d22");set("--mut",dark?"#c9b3bb":"#7a6068");set("--line",dark?"#ffffff26":"#00000018")}
  else{r.removeProperty("--ink");r.removeProperty("--mut");r.removeProperty("--line")}
  $("#title").textContent=cfg.title||DEF.title;
  document.title=cfg.title||DEF.title;
  /* texto do cabeçalho legível sobre fundo escolhido */
  var hc="";
  if(cfg.bgImg)hc="#fff";else if(cfg.bg)hc=lum(cfg.bg)<0.5?"#fff":"#2b1d22";
  $("#title").style.color=hc;
  $("#title").style.textShadow=cfg.bgImg?"0 1px 6px #000a":"none";
  $("#btnCfg").style.background="var(--card)";
}

/* ---------- imagens ---------- */
function shrink(file,max,q){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=rej;
    fr.onload=function(){
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var s=Math.min(1,max/Math.max(im.width,im.height));
        var c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
        c.getContext("2d").drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",q));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- render ---------- */
function cats(){
  var set={};["Assistir","Jogar","Comer","Passear"].forEach(function(c){set[c]=1});
  items.forEach(function(i){if(i.cat)set[i.cat]=1});
  return Object.keys(set);
}
function chips(el,list,cur,fn){
  el.innerHTML="";
  list.forEach(function(c){var b=document.createElement("button");b.className="chip"+(c===cur?" on":"");b.textContent=c;b.onclick=function(){fn(c)};el.appendChild(b)});
}
function embedUrl(u){
  try{var x=new URL(u);
    if(/(^|\.)youtube\.com$/.test(x.hostname)&&x.searchParams.get("v"))return"https://www.youtube.com/embed/"+encodeURIComponent(x.searchParams.get("v"));
    if(x.hostname==="youtu.be")return"https://www.youtube.com/embed/"+encodeURIComponent(x.pathname.slice(1));
  }catch(e){}
  return u;
}
function render(){
  var all=cats();
  $("#cats").innerHTML=all.map(function(c){return'<option value="'+esc(c)+'">'}).join("");
  chips($("#catChips"),["Todos"].concat(all),curCat,function(c){curCat=c;render()});
  chips($("#stChips"),["Todos","Pendentes","Feitos"],curSt,function(c){curSt=c;render()});
  var list=items.slice().sort(function(a,b){return(a.done?1:0)-(b.done?1:0)||(b.ts||0)-(a.ts||0)}).filter(function(i){
    return(curCat==="Todos"||i.cat===curCat)&&(curSt==="Todos"||(curSt==="Feitos")===!!i.done)});
  var box=$("#list");box.innerHTML="";
  if(!list.length){box.innerHTML='<div class="empty box">Nada por aqui ainda. Adicione a primeira ideia! ✨</div>';return}
  list.forEach(function(i){
    var d=document.createElement("div");d.className="box item"+(i.done?" done":"");
    var link=safeUrl(i.link);
    d.innerHTML='<input type="checkbox" '+(i.done?"checked":"")+' aria-label="Marcar como feito">'+
      '<div class="body"><div class="t">'+esc(i.text)+'</div>'+
      '<div class="tag">'+esc(i.cat||"Outros")+(i.done?" · feito ✓":"")+'</div>'+
      (i.note?'<div class="note">'+esc(i.note)+'</div>':"")+
      (i.img?'<img class="thumb" alt="" src="'+esc(i.img)+'">':"")+
      '<div class="acts">'+(link?'<button data-a="open">🔗 Abrir aqui</button><a href="'+esc(link)+'" target="_blank" rel="noopener noreferrer"><button type="button">Nova aba ↗</button></a>':"")+
      '<button data-a="edit">✏️ Editar</button><button data-a="del">🗑️ Excluir</button></div></div>';
    d.querySelector("input").onchange=function(e){i.done=e.target.checked;i.doneAt=Date.now();saveItem(i)};
    var im=d.querySelector(".thumb");if(im)im.onclick=function(){$("#bigImg").src=i.img;$("#imgDlg").showModal()};
    d.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){
      var a=b.dataset.a;
      if(a==="open"){$("#dTitle").textContent=i.text;$("#frame").src=embedUrl(link);$("#dOpen").href=link;$("#dlg").showModal()}
      if(a==="del"){if(confirm("Excluir “"+i.text+"”?"))delItem(i.id)}
      if(a==="edit"){
        var t=prompt("Título:",i.text);if(t===null)return;
        var n=prompt("Anotações:",i.note||"");if(n===null)return;
        var l=prompt("Link (deixe vazio para remover):",i.link||"");if(l===null)return;
        var c=prompt("Categoria:",i.cat||"");if(c===null)return;
        i.text=t.trim()||i.text;i.note=n;i.link=l.trim();i.cat=c.trim()||i.cat;saveItem(i);
      }
    }});
    box.appendChild(d);
  });
}

/* ---------- eventos ---------- */
$("#fImg").onchange=function(e){
  var f=e.target.files[0];pendingImg="";if(!f)return;
  shrink(f,720,0.72).then(function(u){pendingImg=u}).catch(function(){alert("Não consegui ler essa imagem.")});
};
$("#btnAdd").onclick=function(){
  var t=$("#fText").value.trim();if(!t){$("#fText").focus();return}
  var l=$("#fLink").value.trim();if(l&&!/^https?:\/\//i.test(l))l="https://"+l;
  var cat=$("#fCat").value.trim()||(curCat!=="Todos"?curCat:"Outros");
  saveItem({id:uid(),text:t,cat:cat,link:l,note:$("#fNote").value.trim(),img:pendingImg,done:false,ts:Date.now()});
  $("#fText").value="";$("#fLink").value="";$("#fNote").value="";$("#fImg").value="";pendingImg="";
};
$("#fText").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();$("#btnAdd").click()}});
$("#btnCfg").onclick=function(){
  var b=$("#cfgBox");b.hidden=!b.hidden;
  $("#cTitle").value=cfg.title||"";
  $("#cBg").value=cfg.bg||"#fdf2f4";$("#cCard").value=cfg.card||"#ffffff";$("#cAcc").value=cfg.acc||"#e0527a";
};
$("#cTitle").oninput=function(e){cfg.title=e.target.value;saveCfg()};
$("#cBg").oninput=function(e){cfg.bg=e.target.value;saveCfg()};
$("#cCard").oninput=function(e){cfg.card=e.target.value;saveCfg()};
$("#cAcc").oninput=function(e){cfg.acc=e.target.value;saveCfg()};
$("#cBgImg").onchange=function(e){
  var f=e.target.files[0];if(!f)return;
  shrink(f,1280,0.6).then(function(u){cfg.bgImg=u;saveCfg()}).catch(function(){alert("Não consegui ler essa imagem.")});
};
$("#cBgClear").onclick=function(){cfg.bgImg="";saveCfg()};
$("#cReset").onclick=function(){cfg.bg="";cfg.card="";cfg.acc="";saveCfg()};
function closeFrame(){$("#frame").src="about:blank";$("#dlg").close()}
$("#dClose").onclick=closeFrame;
$("#dlg").addEventListener("cancel",function(){$("#frame").src="about:blank"});
$("#imgClose").onclick=function(){$("#imgDlg").close()};

/* ---------- início ---------- */
function syncInfo(on){
  $("#syncInfo").textContent=on
    ?"Sincronizado: quem abrir o site com o mesmo código secreto vê e edita a mesma lista."
    :"Modo local: as anotações ficam só neste navegador. Configure o Firebase no código para sincronizar.";
}
lsLoad();applyCfg();render();syncInfo(false);

var started=false;
function startDb(d){
  if(started||!d)return;started=true;db=d;syncInfo(true);
  /* migra anotações locais para o banco, se houver */
  var local=items.slice();
  var first=true;
  db.collection(BASE+"/items").onSnapshot(function(s){
    var arr=s.docs.map(function(x){var o=x.data()||{};o.id=x.id;return o});
    if(first&&!arr.length&&local.length){local.forEach(function(it){db.collection(BASE+"/items").doc(it.id).set(it).catch(function(){})})}
    first=false;items=arr;render();
  },function(){});
  db.doc(BASE+"/cfg/theme").onSnapshot(function(s){
    if(s.exists){cfg=Object.assign({},DEF,s.data());applyCfg()}
  },function(){});
}
try{
  if(window.firebase&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey!=="COLE_AQUI"){
    var code=localStorage.getItem("nossaLista.codigo");
    if(!code){code=(prompt("Digite o código secreto de vocês (o mesmo nos dois aparelhos):")||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
      if(code)localStorage.setItem("nossaLista.codigo",code)}
    if(code){
      BASE="listas/"+code;
      $("#codeRow").hidden=false;$("#codeShow").textContent=code;
      $("#codeChange").onclick=function(){
        var n=(prompt("Novo código secreto (precisa ser o mesmo nos dois aparelhos).\nAtenção: a lista do código novo começa vazia; a do código atual continua guardada com ele.",code)||"").trim().toLowerCase().replace(/[^a-z0-9_-]/g,"");
        if(n&&n!==code){localStorage.setItem("nossaLista.codigo",n);location.reload()}
      };
      firebase.initializeApp(FIREBASE_CONFIG);
      startDb(firebase.firestore());
    }
  }
}catch(e){console.error(e)}
})();
</script>
</body>
</html>
